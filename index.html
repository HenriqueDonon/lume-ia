<style>
:root{
  --bg:#050c1a;--bg2:#081428;--surf:#0b1b36;--surf2:#0e2141;
  --line:rgba(90,150,235,.16);--cy:#4cc4ff;--az:#5b8dff;--ice:#cfe6ff;
  --txt:#e6f0ff;--dim:#7d9ac9;--ok:#3ee6a8;--warn:#ffb84d;--me:#153a72;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:radial-gradient(900px 600px at 80% -20%,#0c2247 0%,var(--bg) 60%);color:var(--txt);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#brain{position:fixed;inset:0;z-index:0;opacity:.55}
header{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line);background:rgba(5,12,26,.6);backdrop-filter:blur(14px)}
.core{width:30px;height:30px;border-radius:50%;position:relative;flex:none;background:radial-gradient(circle,var(--cy),var(--az));box-shadow:0 0 16px rgba(76,196,255,.5);animation:breathe 3.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.85}50%{transform:scale(1.05);opacity:1}}
.tt{flex:1;min-width:0}
.tt h1{font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--ice)}
.tt p{font-size:11px;color:var(--dim)}
.tt p .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.off{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.iconbtn{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--cy);font-size:16px;cursor:pointer;transition:.2s;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--cy);box-shadow:0 0 14px rgba(76,196,255,.3)}
main{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
#log{max-width:720px;margin:0 auto;padding:22px 16px 8px;display:flex;flex-direction:column;gap:20px}
.msg{max-width:100%;font-size:15px;line-height:1.6;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;gap:12px}
.av{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:13px;margin-top:2px}
.av.ia{background:linear-gradient(135deg,var(--cy),var(--az));color:#04101f;box-shadow:0 0 12px rgba(76,196,255,.35)}
.av.me{background:var(--surf2);border:1px solid var(--line);color:var(--ice)}
.body{flex:1;min-width:0}
.name{font-size:11px;color:var(--dim);margin-bottom:4px;letter-spacing:.5px}
.me .txt{background:var(--me);border:1px solid rgba(91,141,255,.3);padding:11px 15px;border-radius:14px 14px 4px 14px;display:inline-block}
.ia .txt{background:rgba(11,27,54,.55);border:1px solid var(--line);padding:12px 16px;border-radius:4px 14px 14px 14px}
.txt{white-space:pre-wrap;word-break:break-word}
.src{font-size:11px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.src::before{content:"\25C8 "}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cy);margin-right:4px;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.dock{position:relative;z-index:3;padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%)}
.box{max-width:720px;margin:0 auto;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 8px;display:flex;align-items:flex-end;gap:6px;transition:.2s;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.box:focus-within{border-color:var(--cy);box-shadow:0 0 22px rgba(76,196,255,.25)}
#q{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px;padding:10px 6px;resize:none;max-height:120px;line-height:1.4;font-family:inherit}
#q::placeholder{color:var(--dim)}
.send{width:40px;height:40px;flex:none;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,var(--cy),var(--az));color:#04101f;font-size:17px;display:grid;place-items:center;transition:.2s}
.send:hover{filter:brightness(1.15);box-shadow:0 0 16px rgba(76,196,255,.5)}
.send:active{transform:scale(.92)}
.hint{max-width:720px;margin:6px auto 0;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.3px}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(2,6,14,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:11;left:0;right:0;bottom:0;max-height:82dvh;background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet h2{font-size:13px;letter-spacing:1px;color:var(--cy);padding:6px 20px 12px;display:flex;justify-content:space-between;align-items:center}
.sheet .close{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
.form{padding:0 20px 16px;display:flex;flex-direction:column;gap:8px}
.form label{font-size:11px;color:var(--dim);letter-spacing:.5px;margin-top:4px}
.form input,.form textarea{background:var(--surf);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;font-size:15px;outline:none;font-family:inherit;transition:.2s}
.form input:focus,.form textarea:focus{border-color:var(--cy)}
.form textarea{resize:vertical;min-height:70px}
.form .save{margin-top:6px;background:linear-gradient(135deg,var(--cy),var(--az));color:#04101f;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;letter-spacing:.5px;cursor:pointer}
.klist{overflow-y:auto;padding:0 20px 16px;flex:1}
.kstat{font-size:11px;color:var(--dim);padding:0 20px 6px}
.kstat b{color:var(--cy)}
.kitem{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--surf);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13px}
.kitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kitem .del{background:none;border:none;color:#ff6b8a;font-size:16px;cursor:pointer;padding:2px 6px}
.actions{display:flex;gap:8px;padding:0 20px 14px}
.actions button{flex:1;background:var(--surf);border:1px solid var(--line);color:var(--cy);border-radius:12px;padding:11px;font-size:12px;cursor:pointer;transition:.2s}
.actions button:hover{border-color:var(--cy)}
main::-webkit-scrollbar,.klist::-webkit-scrollbar{width:5px}
main::-webkit-scrollbar-thumb,.klist::-webkit-scrollbar-thumb{background:var(--az);border-radius:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <div class="grab"></div>

<div class="sheet" id="llmSheet">
  <div class="grab"></div>
  <h2>MODO IA AVANCADA <button class="close" onclick="document.getElementById('llmSheet').classList.remove('open');document.getElementById('ov').classList.remove('open')">&times;</button></h2>
  <div class="form">
    <label>Escolha o modelo. Maior = melhor, porem baixa mais e roda mais devagar. Baixa uma vez, depois funciona offline.</label>
    <button class="save" style="background:var(--surf);color:var(--cy);border:1px solid var(--line)" onclick="pickModel('05')">0.5B &middot; leve &middot; ~950 MB &middot; ideal p/ celular</button>
    <button class="save" style="background:var(--surf);color:var(--cy);border:1px solid var(--line)" onclick="pickModel('1')">1B &middot; equilibrado &middot; ~880 MB &middot; recomendado</button>
    <button class="save" style="background:var(--surf);color:var(--cy);border:1px solid var(--line)" onclick="pickModel('2')">2B &middot; melhor &middot; ~1.6 GB &middot; p/ PC ou S23+</button>
  </div>

<script>
let mem={};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let KB=store.get('lume_kb')||[];

/* ===== CONFIG FIREBASE — cole os dados do seu projeto aqui ===== */
const FB={
  apiKey:"AIzaSyChep0lglextqrpE-8RT-wJaqhg4__7V_w",
  authDomain:"lume-ia-d1d58.firebaseapp.com",
  projectId:"lume-ia-d1d58",
  storageBucket:"lume-ia-d1d58.firebasestorage.app",
  messagingSenderId:"21848567116",
  appId:"1:21848567116:web:23d1f5cabdc077f47433e9"
};
let db=null,uid=null,CLOUD=false;
let GLOBAL=[],PRIV=[];            // memoria da nuvem: global + privada
function allKB(){return CLOUD?[...PRIV,...GLOBAL,...SEED_ARR()]:KB}
function SEED_ARR(){return (store.get('lume_kb')||[])}

async function initCloud(){
  if(FB.apiKey.includes("COLE"))return; // sem config -> modo local
  try{
    firebase.initializeApp(FB);
    db=firebase.firestore();
    try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
    const c=await firebase.auth().signInAnonymously();
    uid=c.user.uid;CLOUD=true;
    // sincroniza base comum em tempo real (funciona offline via cache)
    db.collection('knowledge').onSnapshot(snap=>{
      GLOBAL=snap.docs.map(d=>({id:d.id,...d.data()}));renderKB();graph.rebuild();
    });
    // sincroniza memoria privada deste usuario
    db.collection('users').doc(uid).collection('memory').onSnapshot(snap=>{
      PRIV=snap.docs.map(d=>({id:d.id,...d.data()}));renderKB();graph.rebuild();
    });
    bubble('Conectado a nuvem. Base comum + sua memoria privada sincronizadas. Funciona offline pelo cache.','ia','firestore');
  }catch(e){CLOUD=false}
}


const SEED=[
 {q:"ola oi eae salve",a:"Ola! Tudo bem? Em que posso te ajudar?"},
 {q:"tudo bem como voce esta",a:"Tudo otimo por aqui! E com voce, como esta?"},
 {q:"bom dia",a:"Bom dia! Que seu dia seja produtivo. Como posso ajudar?"},
 {q:"boa tarde",a:"Boa tarde! Estou por aqui, e so pedir."},
 {q:"boa noite",a:"Boa noite! Precisa de algo antes de descansar?"},
 {q:"quem e voce o que voce e",a:"Sou a LUME, uma IA local que roda no seu aparelho. Aprendo com o que voce me ensina e funciono ate sem internet."},
 {q:"qual seu nome",a:"Meu nome e LUME."},
 {q:"o que voce faz sabe fazer pode fazer",a:"Respondo o que ja aprendi, busco na internet quando estou online e guardo tudo para funcionar offline. Voce tambem pode me ensinar coisas novas no botao com o cerebro."},
 {q:"como voce funciona",a:"Guardo conhecimento em nos na memoria do aparelho. Quando pergunto algo, procuro a resposta mais parecida. Se nao sei e estou online, busco na Wikipedia e aprendo."},
 {q:"como te ensinar aprender ensino",a:"Toque no botao do cerebro no topo, escreva uma pergunta e a resposta, e toque em gravar. Pronto, aprendi!"},
 {q:"obrigado obrigada valeu agradeco",a:"De nada! Estou aqui sempre que precisar."},
 {q:"tchau ate logo ate mais adeus",a:"Ate logo! Volte quando quiser."},
 {q:"voce e humano robo pessoa",a:"Sou um programa, uma IA. Nao sou humana, mas gosto de ajudar."},
 {q:"me ajuda ajuda preciso de ajuda",a:"Claro! Me diga o que voce precisa e eu tento ajudar."},
 {q:"voce esta online offline internet",a:"Veja a bolinha no topo: verde e online, amarela e offline. Mesmo offline eu respondo o que ja sei."},
 {q:"que horas sao horario",a:"Nao tenho relogio proprio, mas seu aparelho mostra a hora certinha no canto da tela."},
 {q:"voce me ouve entende",a:"Entendo o que voce escreve! Digite sua pergunta que eu respondo."},
 {q:"sim ok certo entendi",a:"Perfeito! Em que mais posso ajudar?"},
 {q:"nao",a:"Sem problema. Estou por aqui se mudar de ideia."},
 {q:"voce e legal gosto de voce",a:"Que bom! Gosto de te ajudar tambem."}
];
function seedKB(){
  if(store.get('lume_seeded'))return;
  SEED.forEach(e=>KB.push({id:Date.now()+Math.random(),q:e.q,a:e.a,o:'base'}));
  store.set('lume_kb',KB);store.set('lume_seeded',1);
}
seedKB();

const STOP=new Set('a o e de da do em um uma que com por para as os na no se ao sao foi ser tem como mais ou sua seu isso este esta qual quais onde quando porque quem sobre'.split(' '));
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/(.)\1{2,}/g,'$1').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
function squish(w){return w.replace(/(.)\1+/g,'$1');}
const tok=s=>norm(s).split(' ').filter(w=>w.length>1&&!STOP.has(w));
function score(qT,e){const eT=new Set([...tok(e.q),...tok(e.a).slice(0,30)]);let h=0;qT.forEach(t=>{if(eT.has(t))h++});return qT.length?h/qT.length:0}
const GREET=/\b(ola|oi|oie|oii|eae|salve|opa|alo|bom dia|boa tarde|boa noite|tchau|adeus|obrigad|valeu|blz|beleza|tranquilo|firmeza)\b/i;
function isGreeting(q){const n=norm(q);if(GREET.test(' '+n+' '))return true;const first=n.split(' ')[0]||'';return ['oi','oii','oie','ola','eai','eae','opa','alo','salve','blz'].includes(squish(first));}
function localAnswer(q){
  const SRC=CLOUD?[...PRIV,...GLOBAL,...KB]:KB;
  const qn=norm(q);
  const qT=qn.split(' ').filter(w=>w.length>1&&!STOP.has(w));
  const qSq=qT.map(squish);
  let b=null,bs=0;
  SRC.forEach(e=>{
    const keys=norm(e.q).split(' ').filter(w=>w.length>1);
    const kSet=new Set(keys), kSq=new Set(keys.map(squish));
    let hit=0;
    qT.forEach((t,idx)=>{ if(kSet.has(t)||kSq.has(qSq[idx]))hit++; });
    // tambem conta palavras-chave da entrada presentes na pergunta (bidirecional)
    let hit2=0;
    keys.forEach(k=>{ if(qn.indexOf(k)>=0||qSq.includes(squish(k)))hit2++; });
    const denom=Math.max(qT.length,1);
    const sc=Math.max(hit/denom, hit2/Math.max(keys.length,1)*0.9);
    if(sc>bs){bs=sc;b=e;}
  });
  if(bs>=0.3)return{a:b.a,src:'memoria - '+Math.round(bs*100)+'%'};
  // saudacao curta que nao bateu: responde de forma amigavel
  if(isGreeting(q)){
    const g=SRC.find(e=>/\b(ola|oi)\b/.test(norm(e.q)));
    if(g)return{a:g.a,src:'memoria - conversa'};
    return{a:'Oi! Tudo bem? Em que posso ajudar?',src:'conversa'};
  }
  return null;
}
function cleanQuery(q){return q.toLowerCase().replace(/^(me\s+)?(fale|fala|conte|conta|explique|explica|diga|fale-me)\s+(sobre|me sobre|de|do|da|dos|das)?\s*/,'').replace(/^o que (e|sao|significa)\s+/,'').replace(/^quem (e|foi|sao)\s+/,'').replace(/^qual (e|a|o)?\s*/,'').replace(/\?+$/,'').trim()||q;}
async function wikiSummary(title,lang){try{const r=await fetch('https://'+lang+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));const d=await r.json();if(d&&d.extract&&d.type!=='disambiguation')return{fonte:'Wikipedia',titulo:d.title,texto:d.extract};}catch(e){}return null;}
async function wikiSearch(q,lang){try{const r=await fetch('https://'+lang+'.wikipedia.org/w/api.php?action=query&list=search&srlimit=3&format=json&origin=*&srsearch='+encodeURIComponent(q));const d=await r.json();const hits=(d.query&&d.query.search)||[];const out=[];for(let i=0;i<Math.min(2,hits.length);i++){const s=await wikiSummary(hits[i].title,lang);if(s)out.push(s);}return out;}catch(e){return[];}}
async function ddgAnswer(q){try{const r=await fetch('https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&q='+encodeURIComponent(q));const d=await r.json();const t=d.AbstractText||d.Answer||(d.RelatedTopics&&d.RelatedTopics[0]&&d.RelatedTopics[0].Text)||'';if(t)return{fonte:'DuckDuckGo',titulo:d.Heading||q,texto:t};}catch(e){}return null;}
async function wiktionary(term){try{const r=await fetch('https://pt.wiktionary.org/api/rest_v1/page/summary/'+encodeURIComponent(term));const d=await r.json();if(d&&d.extract)return{fonte:'Wikcionario',titulo:d.title,texto:d.extract};}catch(e){}return null;}
async function multiSearch(q){
  const termo=cleanQuery(q);
  const jobs=[wikiSearch(termo,'pt'),ddgAnswer(termo)];
  if(termo.split(' ').length<=2)jobs.push(wiktionary(termo));
  let res=(await Promise.all(jobs)).flat().filter(Boolean);
  if(res.length===0){res=(await wikiSearch(termo,'en')).filter(Boolean);}
  // remove duplicados por titulo
  const seen=new Set();res=res.filter(r=>{const k=(r.titulo||'').toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
  return res.slice(0,4);
}
async function onlineAnswer(q){
  const res=await multiSearch(q);
  if(!res.length)return null;
  const melhor=res[0];
  const fontes=[...new Set(res.map(r=>r.fonte))].join(', ');
  addKB(q,melhor.texto,'web');
  return{a:melhor.texto,src:'internet ('+fontes+') - '+res.length+' fonte(s), gravado para uso offline'};
}
const PERSONAL=/\b(me chame|meu nome|minha idade|eu prefiro|eu moro|eu trabalho|eu sou o|eu sou a|lembre que eu|lembre se|anote que eu)\b/i;function addKB(q,a,o){if(CLOUD){const priv=(o==='manual'&&PERSONAL.test(q));const rec={q,a,o:o||'manual',t:Date.now()};if(priv){db.collection('users').doc(uid).collection('memory').add(rec);}else{db.collection('knowledge').add(rec);}return;}KB.push({id:Date.now()+Math.random(),q,a,o:o||'manual'});store.set('lume_kb',KB);renderKB();graph.rebuild()}
function delKB(id){if(CLOUD){if(PRIV.find(e=>e.id===id)){db.collection('users').doc(uid).collection('memory').doc(id).delete();}else if(GLOBAL.find(e=>e.id===id)){db.collection('knowledge').doc(id).delete();}return;}KB=KB.filter(e=>e.id!==id);store.set('lume_kb',KB);renderKB();graph.rebuild()}

async function importPack(){
  if(CLOUD){
    if(store.get('lume_pack')){bubble('A base inicial ja foi importada para a nuvem.','ia','sistema');return}
    try{
      let b=db.batch();
      SEED_PACK.forEach(e=>{b.set(db.collection('knowledge').doc(),{q:e.q,a:e.a,o:'base',t:Date.now()})});
      await b.commit();store.set('lume_pack',1);
      bubble('Base inicial importada: '+SEED_PACK.length+' respostas adicionadas ao cerebro comum.','ia','importacao');
    }catch(e){bubble('Nao consegui importar agora. Verifique a conexao e tente de novo.','ia','erro')}
  }else{
    let n=0;SEED_PACK.forEach(e=>{KB.push({id:Date.now()+Math.random(),q:e.q,a:e.a,o:'base'});n++});
    store.set('lume_kb',KB);renderKB();graph.rebuild();
    bubble('Base inicial carregada: '+n+' respostas (modo local).','ia','importacao');
  }
}

qEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});

/* ===== MODO IA AVANCADA — LLM offline via WebLLM (WebGPU) ===== */
const LLM_MODELS={
  '05':{id:"Qwen2.5-0.5B-Instruct-q4f16_1-MLC",nome:"0.5B (leve)",mb:"~950 MB"},
  '1':{id:"Llama-3.2-1B-Instruct-q4f16_1-MLC",nome:"1B (equilibrado)",mb:"~880 MB"},
  '2':{id:"gemma-2-2b-it-q4f16_1-MLC",nome:"2B (melhor)",mb:"~1.6 GB"}
};
let engine=null,LLM_READY=false,LLM_LOADING=false,LLM_CUR=null;
function topKB(q,n){
  const SRC=CLOUD?[...PRIV,...GLOBAL,...KB]:KB;
  const qn=norm(q),qT=qn.split(' ').filter(w=>w.length>1&&!STOP.has(w));
  return SRC.map(e=>{const keys=norm(e.q).split(' ');let h=0;qT.forEach(t=>{if(keys.includes(t))h++});return{e,s:h}})
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.e);
}
function toggleLLM(){
  if(LLM_LOADING){bubble('O modelo ja esta carregando, aguarde...','ia','llm');return;}
  if(!navigator.gpu){bubble('Este aparelho/navegador nao tem WebGPU, entao nao consigo rodar o LLM offline aqui. Continuo no modo normal (base + internet). Use o Chrome atualizado.','ia','llm');return;}
  document.getElementById('llmSheet').classList.add('open');
  document.getElementById('ov').classList.add('open');
}
function pickModel(k){
  document.getElementById('llmSheet').classList.remove('open');
  document.getElementById('ov').classList.remove('open');
  loadLLM(k);
}
async function loadLLM(k){
  const m=LLM_MODELS[k];
  LLM_LOADING=true;LLM_READY=false;LLM_CUR=k;
  document.getElementById('llmBtn').style.color='var(--warn)';
  const w=bubble('Preparando modelo '+m.nome+' ('+m.mb+' na primeira vez, depois offline)...','ia','llm');
  try{
    const webllm=await import('https://esm.run/@mlc-ai/web-llm');
    engine=await webllm.CreateMLCEngine(m.id,{initProgressCallback:(p)=>{
      w.querySelector('.txt').textContent='Carregando '+m.nome+': '+Math.round((p.progress||0)*100)+'%';
    }});
    LLM_READY=true;LLM_LOADING=false;
    document.getElementById('llmBtn').style.color='var(--ok)';
    w.querySelector('.txt').textContent='IA '+m.nome+' pronta! Agora gero respostas de verdade, usando o que voce me ensinou. Funciona offline daqui pra frente.';
  }catch(err){
    LLM_LOADING=false;document.getElementById('llmBtn').style.color='';
    w.querySelector('.txt').textContent='Nao consegui carregar ('+(err&&err.message?err.message:'erro')+'). Na primeira vez precisa de internet. Continuo no modo normal.';
  }
}
async function llmStream(q,el){
  let ctx=topKB(q,3).map(function(e){return '- '+e.q+': '+e.a}).join('\n');
  const infoQ=/\b(o que|que e|que sao|qual|quais|quem|quando|onde|como|porque|por que|quantos|quantas|significa|fale sobre|fale de|explique|explica|defina|para que serve)\b/i.test(norm(q));
  if(infoQ&&navigator.onLine){try{el.querySelector('.txt').textContent='Pesquisando em varias fontes...';const web=await multiSearch(q);if(web.length){ctx+=(ctx?'\n':'')+web.map(function(r){return '['+r.fonte+'] '+r.titulo+': '+r.texto}).join('\n');}}catch(_){}}
  const sys='Voce e a LUME, uma assistente em portugues do Brasil. Responda de forma curta, clara e correta. Use as fontes e a base abaixo para responder de forma completa e acertiva, combinando as informacoes. Se as fontes divergirem, use a mais consistente. Se nada responder, diga que nao sabe.'+(ctx?'\n\nBase de conhecimento:\n'+ctx:'');
  const msgs=[{role:'system',content:sys},{role:'user',content:q}];
  const tx=el.querySelector('.txt');
  function done(){var b=el.querySelector('.body');var t=document.createElement('div');t.className='src';t.innerHTML='&#9672; IA avancada (offline)';b.appendChild(t);}
  try{
    const stream=await engine.chat.completions.create({messages:msgs,stream:true,temperature:0.6,max_tokens:512});
    let acc='';
    for await(const ch of stream){var d='';try{d=(ch&&ch.choices&&ch.choices[0]&&ch.choices[0].delta&&ch.choices[0].delta.content)||'';}catch(_){}if(d){acc+=d;tx.textContent=acc;scroll.scrollTop=scroll.scrollHeight;}}
    if(acc.trim()){done();return;}
  }catch(e1){}
  try{
    tx.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
    const r=await engine.chat.completions.create({messages:msgs,temperature:0.6,max_tokens:512});
    var out='';try{out=r.choices[0].message.content;}catch(_){out='';}
    if(out&&out.trim()){tx.textContent=out.trim();done();return;}
    tx.textContent='Nao consegui gerar resposta desta vez. Tente reformular.';
  }catch(e2){
    tx.textContent='Erro na IA: '+((e2&&e2.message)?e2.message:e2)+'. Tente de novo ou use um modelo menor no botao do topo.';
  }
}

const graph=(()=>{const cv=document.getElementById('brain'),cx=cv.getContext('2d');let W,H,nodes=[],links=[],pulses=[];const red=matchMedia('(prefers-reduced-motion: reduce)').matches;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',()=>{size();rebuild()});size();
function rebuild(){const base=innerWidth<600?12:18,extra=Math.min(KB.length,30);nodes=[];links=[];for(let i=0;i<base+extra;i++)nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:i<base?1.4+Math.random()*1.4:2.4+Math.random()*1.8,kb:i>=base});for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++)if(Math.random()<.06)links.push([i,j]);document.getElementById('ns').textContent=links.length}
function fire(){if(red)return;for(let k=0;k<5;k++){const l=links[Math.floor(Math.random()*links.length)];if(l)pulses.push({l,p:0,s:.012+Math.random()*.02})}}
function step(){cx.clearRect(0,0,W,H);if(!red)nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1});cx.lineWidth=.6;links.forEach(([a,b])=>{const A=nodes[a],B=nodes[b],d=Math.hypot(A.x-B.x,A.y-B.y);if(d<380){cx.strokeStyle='rgba(76,150,255,'+(.14*(1-d/380))+')';cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(B.x,B.y);cx.stroke()}});pulses=pulses.filter(p=>p.p<1);pulses.forEach(p=>{p.p+=p.s;const A=nodes[p.l[0]],B=nodes[p.l[1]],x=A.x+(B.x-A.x)*p.p,y=A.y+(B.y-A.y)*p.p;cx.fillStyle='rgba(76,196,255,'+(1-p.p)+')';cx.beginPath();cx.arc(x,y,2.2,0,7);cx.fill()});nodes.forEach(n=>{cx.fillStyle=n.kb?'rgba(76,196,255,.9)':'rgba(125,154,201,.5)';cx.shadowBlur=n.kb?9:0;cx.shadowColor='#4cc4ff';cx.beginPath();cx.arc(n.x,n.y,n.r,0,7);cx.fill();cx.shadowBlur=0});requestAnimationFrame(step)}
rebuild();step();if(!red)setInterval(fire,2800);return{rebuild,fire}})();
renderKB();
initCloud();
bubble('Nucleo inicializado. '+KB.length+' nos na memoria local. Pergunte algo, ou toque em \uD83E\uDDE0 para me ensinar. Tudo fica salvo so neste aparelho.','ia','sistema');
</script>
