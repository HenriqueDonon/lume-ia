<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#040a16">
<title>LUME IA</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#050c1a;--bg2:#081428;--surf:#0b1b36;--surf2:#0e2141;
  --line:rgba(90,150,235,.16);--cy:#4cc4ff;--az:#5b8dff;--ice:#cfe6ff;
  --txt:#e6f0ff;--dim:#7d9ac9;--ok:#3ee6a8;--warn:#ffb84d;--me:#153a72;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:radial-gradient(900px 600px at 80% -20%,#0c2247 0%,var(--bg) 60%);color:var(--txt);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
#brain{position:fixed;inset:0;z-index:0;opacity:.55}
header{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line);background:rgba(5,12,26,.6);backdrop-filter:blur(14px)}
.core{width:30px;height:30px;border-radius:50%;position:relative;flex:none;background:radial-gradient(circle,var(--cy),var(--az));box-shadow:0 0 16px rgba(76,196,255,.5);animation:breathe 3.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.85}50%{transform:scale(1.05);opacity:1}}
.tt{flex:1;min-width:0}
.tt h1{font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--ice)}
.tt p{font-size:11px;color:var(--dim)}
.tt p .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}.off{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.iconbtn{width:38px;height:38px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--cy);font-size:16px;cursor:pointer;transition:.2s;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--cy);box-shadow:0 0 14px rgba(76,196,255,.3)}
main{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
#log{max-width:720px;margin:0 auto;padding:22px 16px 8px;display:flex;flex-direction:column;gap:20px}
.msg{max-width:100%;font-size:15px;line-height:1.6;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.row{display:flex;gap:12px}
.av{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:13px;margin-top:2px}
.av.ia{background:linear-gradient(135deg,var(--cy),var(--az));color:#04101f;box-shadow:0 0 12px rgba(76,196,255,.35)}
.av.me{background:var(--surf2);border:1px solid var(--line);color:var(--ice)}
.body{flex:1;min-width:0}
.name{font-size:11px;color:var(--dim);margin-bottom:4px;letter-spacing:.5px}
.me .txt{background:var(--me);border:1px solid rgba(91,141,255,.3);padding:11px 15px;border-radius:14px 14px 4px 14px;display:inline-block}
.ia .txt{background:rgba(11,27,54,.55);border:1px solid var(--line);padding:12px 16px;border-radius:4px 14px 14px 14px}
.txt{white-space:pre-wrap;word-break:break-word}
.src{font-size:11px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.src::before{content:"\25C8 "}
.typing i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--cy);margin-right:4px;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.dock{position:relative;z-index:3;padding:8px 12px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%)}
.box{max-width:720px;margin:0 auto;background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 8px;display:flex;align-items:flex-end;gap:6px;transition:.2s;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.box:focus-within{border-color:var(--cy);box-shadow:0 0 22px rgba(76,196,255,.25)}
#q{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px;padding:10px 6px;resize:none;max-height:120px;line-height:1.4;font-family:inherit}
#q::placeholder{color:var(--dim)}
.send{width:40px;height:40px;flex:none;border:none;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,var(--cy),var(--az));color:#04101f;font-size:17px;display:grid;place-items:center;transition:.2s}
.send:hover{filter:brightness(1.15);box-shadow:0 0 16px rgba(76,196,255,.5)}
.send:active{transform:scale(.92)}
.hint{max-width:720px;margin:6px auto 0;text-align:center;font-size:10px;color:var(--dim);letter-spacing:.3px}
.overlay{position:fixed;inset:0;z-index:10;background:rgba(2,6,14,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:11;left:0;right:0;bottom:0;max-height:82dvh;background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet h2{font-size:13px;letter-spacing:1px;color:var(--cy);padding:6px 20px 12px;display:flex;justify-content:space-between;align-items:center}
.sheet .close{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
.form{padding:0 20px 16px;display:flex;flex-direction:column;gap:8px}
.form label{font-size:11px;color:var(--dim);letter-spacing:.5px;margin-top:4px}
.form input,.form textarea{background:var(--surf);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;font-size:15px;outline:none;font-family:inherit;transition:.2s}
.form input:focus,.form textarea:focus{border-color:var(--cy)}
.form textarea{resize:vertical;min-height:70px}
.form .save{margin-top:6px;background:linear-gradient(135deg,var(--cy),var(--az));color:#04101f;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;letter-spacing:.5px;cursor:pointer}
.klist{overflow-y:auto;padding:0 20px 16px;flex:1}
.kstat{font-size:11px;color:var(--dim);padding:0 20px 6px}
.kstat b{color:var(--cy)}
.kitem{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--surf);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13px}
.kitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kitem .del{background:none;border:none;color:#ff6b8a;font-size:16px;cursor:pointer;padding:2px 6px}
.actions{display:flex;gap:8px;padding:0 20px 14px}
.actions button{flex:1;background:var(--surf);border:1px solid var(--line);color:var(--cy);border-radius:12px;padding:11px;font-size:12px;cursor:pointer;transition:.2s}
.actions button:hover{border-color:var(--cy)}
main::-webkit-scrollbar,.klist::-webkit-scrollbar{width:5px}
main::-webkit-scrollbar-thumb,.klist::-webkit-scrollbar-thumb{background:var(--az);border-radius:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="brain"></canvas>
<header>
  <div class="core"></div>
  <div class="tt"><h1>LUME IA</h1><p><span class="dot" id="netdot"></span><span id="nettxt"></span></p></div>
  <button class="iconbtn" onclick="openSheet()" title="Aprender / Memoria">&#129504;</button>
</header>
<main id="scroll"><div id="log"></div></main>
<div class="dock">
  <div class="box">
    <textarea id="q" rows="1" placeholder="Pergunte algo..." autocomplete="off"></textarea>
    <button class="send" onclick="ask()">&#10148;</button>
  </div>
  <div class="hint">100% local &middot; offline &middot; seus dados nunca saem do aparelho</div>
</div>
<div class="overlay" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h2>MODULO DE APRENDIZADO <button class="close" onclick="closeSheet()">&times;</button></h2>
  <div class="form">
    <label>PERGUNTA / TOPICO</label>
    <input id="tq" placeholder="Ex.: O que e firewall?">
    <label>RESPOSTA (conhecimento a gravar)</label>
    <textarea id="ta" placeholder="Ex.: Firewall controla o trafego de rede..."></textarea>
    <button class="save" onclick="teach()">&#129504; Gravar no nucleo</button>
  </div>
  <div class="kstat">MEMORIA NEURAL &middot; <b id="nn">0</b> nos &middot; <b id="ns">0</b> sinapses</div>
  <div class="klist" id="klist"></div>
  <div class="actions">
    <button onclick="backup()">&#8595; Backup</button>
    <button onclick="document.getElementById('restore').click()">&#8593; Restaurar</button>
    <input type="file" id="restore" accept=".json" style="display:none">
  </div>
</div>
<script>
let mem={};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
let KB=store.get('lume_kb')||[];

const SEED=[
 {q:"ola oi eae salve",a:"Ola! Tudo bem? Em que posso te ajudar?"},
 {q:"tudo bem como voce esta",a:"Tudo otimo por aqui! E com voce, como esta?"},
 {q:"bom dia",a:"Bom dia! Que seu dia seja produtivo. Como posso ajudar?"},
 {q:"boa tarde",a:"Boa tarde! Estou por aqui, e so pedir."},
 {q:"boa noite",a:"Boa noite! Precisa de algo antes de descansar?"},
 {q:"quem e voce o que voce e",a:"Sou a LUME, uma IA local que roda no seu aparelho. Aprendo com o que voce me ensina e funciono ate sem internet."},
 {q:"qual seu nome",a:"Meu nome e LUME."},
 {q:"o que voce faz sabe fazer pode fazer",a:"Respondo o que ja aprendi, busco na internet quando estou online e guardo tudo para funcionar offline. Voce tambem pode me ensinar coisas novas no botao com o cerebro."},
 {q:"como voce funciona",a:"Guardo conhecimento em nos na memoria do aparelho. Quando pergunto algo, procuro a resposta mais parecida. Se nao sei e estou online, busco na Wikipedia e aprendo."},
 {q:"como te ensinar aprender ensino",a:"Toque no botao do cerebro no topo, escreva uma pergunta e a resposta, e toque em gravar. Pronto, aprendi!"},
 {q:"obrigado obrigada valeu agradeco",a:"De nada! Estou aqui sempre que precisar."},
 {q:"tchau ate logo ate mais adeus",a:"Ate logo! Volte quando quiser."},
 {q:"voce e humano robo pessoa",a:"Sou um programa, uma IA. Nao sou humana, mas gosto de ajudar."},
 {q:"me ajuda ajuda preciso de ajuda",a:"Claro! Me diga o que voce precisa e eu tento ajudar."},
 {q:"voce esta online offline internet",a:"Veja a bolinha no topo: verde e online, amarela e offline. Mesmo offline eu respondo o que ja sei."},
 {q:"que horas sao horario",a:"Nao tenho relogio proprio, mas seu aparelho mostra a hora certinha no canto da tela."},
 {q:"voce me ouve entende",a:"Entendo o que voce escreve! Digite sua pergunta que eu respondo."},
 {q:"sim ok certo entendi",a:"Perfeito! Em que mais posso ajudar?"},
 {q:"nao",a:"Sem problema. Estou por aqui se mudar de ideia."},
 {q:"voce e legal gosto de voce",a:"Que bom! Gosto de te ajudar tambem."}
];
function seedKB(){
  if(store.get('lume_seeded'))return;
  SEED.forEach(e=>KB.push({id:Date.now()+Math.random(),q:e.q,a:e.a,o:'base'}));
  store.set('lume_kb',KB);store.set('lume_seeded',1);
}
seedKB();

const STOP=new Set('a o e de da do em um uma que com por para as os na no se ao sao foi ser tem como mais ou sua seu isso este esta qual quais onde quando porque quem sobre'.split(' '));
const tok=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w));
function score(qT,e){const eT=new Set([...tok(e.q),...tok(e.a).slice(0,30)]);let h=0;qT.forEach(t=>{if(eT.has(t))h++});return qT.length?h/qT.length:0}
const GREET=/\b(ola|oi|oie|eae|salve|bom dia|boa tarde|boa noite|tchau|adeus|obrigad|valeu|sim|nao|ok)\b/i;function localAnswer(q){const qT=tok(q);let b=null,bs=0;KB.forEach(e=>{const s=score(qT,e);if(s>bs){bs=s;b=e}});if(bs>=0.34)return{a:b.a,src:'memoria local &middot; confianca '+Math.round(bs*100)+'%'};if(GREET.test(q)){const qn=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let gb=null,gs=0;KB.forEach(e=>{const ew=e.q.split(' ');let h=0;ew.forEach(w=>{if(w.length>1&&qn.includes(w))h++});const sc=h/Math.max(ew.length,1);if(sc>gs){gs=sc;gb=e}});if(gs>0)return{a:gb.a,src:'memoria local &middot; conversa'}}return null}
async function onlineAnswer(q){try{const s=await fetch('https://pt.wikipedia.org/w/api.php?action=opensearch&limit=1&format=json&origin=*&search='+encodeURIComponent(q));const t=(await s.json())[1][0];if(!t)return null;const r=await fetch('https://pt.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t));const d=await r.json();if(!d.extract)return null;addKB(q,d.extract,'wikipedia');return{a:d.extract,src:'internet (Wikipedia) - gravado para uso offline'}}catch(e){return null}}
function addKB(q,a,o){KB.push({id:Date.now()+Math.random(),q,a,o:o||'manual'});store.set('lume_kb',KB);renderKB();graph.rebuild()}
function delKB(id){KB=KB.filter(e=>e.id!==id);store.set('lume_kb',KB);renderKB();graph.rebuild()}
function renderKB(){const l=document.getElementById('klist');l.innerHTML='';KB.slice().reverse().forEach(e=>{const d=document.createElement('div');d.className='kitem';d.innerHTML='<span title="'+e.a.replace(/"/g,'&quot;')+'">'+(e.o==='wikipedia'?'\uD83C\uDF10 ':'\uD83E\uDDE0 ')+e.q+'</span>';const b=document.createElement('button');b.className='del';b.textContent='\u2715';b.onclick=()=>delKB(e.id);d.appendChild(b);l.appendChild(d)});document.getElementById('nn').textContent=KB.length}
const log=document.getElementById('log'),scroll=document.getElementById('scroll');
function bubble(txt,who,src){const m=document.createElement('div');m.className='msg '+who;const av=who==='ia'?'\u25C8':'V',nm=who==='ia'?'LUME':'Voce';m.innerHTML='<div class="row"><div class="av '+who+'">'+av+'</div><div class="body"><div class="name">'+nm+'</div><div class="txt"></div></div></div>';m.querySelector('.txt').textContent=txt;if(src){const s=document.createElement('div');s.className='src';s.innerHTML=src;m.querySelector('.body').appendChild(s)}log.appendChild(m);scroll.scrollTop=scroll.scrollHeight;return m}
async function ask(){const i=document.getElementById('q'),q=i.value.trim();if(!q)return;i.value='';i.style.height='auto';bubble(q,'me');const w=bubble('','ia');w.querySelector('.txt').innerHTML='<span class="typing"><i></i><i></i><i></i></span>';graph.fire();let r=localAnswer(q);if(!r&&navigator.onLine)r=await onlineAnswer(q);w.remove();if(r)bubble(r.a,'ia',r.src);else bubble(navigator.onLine?'Nao encontrei na memoria nem online. Toque em \uD83E\uDDE0 e me ensine.':'Estou offline e ainda nao sei isso. Toque em \uD83E\uDDE0 e me ensine - ficarei disponivel sem internet.','ia','sem resultado')}
const qEl=document.getElementById('q');
qEl.addEventListener('input',()=>{qEl.style.height='auto';qEl.style.height=Math.min(qEl.scrollHeight,120)+'px'});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
function teach(){const q=document.getElementById('tq'),a=document.getElementById('ta');if(!q.value.trim()||!a.value.trim())return;addKB(q.value.trim(),a.value.trim(),'manual');bubble('Aprendido: "'+q.value.trim()+'". Novo no no nucleo.','ia','aprendizado');graph.fire();q.value='';a.value='';closeSheet()}
function openSheet(){document.getElementById('sheet').classList.add('open');document.getElementById('ov').classList.add('open')}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('ov').classList.remove('open')}
function backup(){const b=new Blob([JSON.stringify(KB)],{type:'application/json'});const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='lume-ia-memoria.json';l.click();URL.revokeObjectURL(u)}
document.getElementById('restore').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(Array.isArray(d)){KB=d;store.set('lume_kb',KB);renderKB();graph.rebuild();bubble('Memoria restaurada: '+KB.length+' nos.','ia','restauracao')}}catch(_){}};r.readAsText(f)});
function net(){const on=navigator.onLine;document.getElementById('netdot').className='dot '+(on?'on':'off');document.getElementById('nettxt').textContent=on?'Online - posso aprender da internet':'Offline - modo autonomo'}
addEventListener('online',net);addEventListener('offline',net);net();
const graph=(()=>{const cv=document.getElementById('brain'),cx=cv.getContext('2d');let W,H,nodes=[],links=[],pulses=[];const red=matchMedia('(prefers-reduced-motion: reduce)').matches;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',()=>{size();rebuild()});size();
function rebuild(){const base=innerWidth<600?12:18,extra=Math.min(KB.length,30);nodes=[];links=[];for(let i=0;i<base+extra;i++)nodes.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:i<base?1.4+Math.random()*1.4:2.4+Math.random()*1.8,kb:i>=base});for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++)if(Math.random()<.06)links.push([i,j]);document.getElementById('ns').textContent=links.length}
function fire(){if(red)return;for(let k=0;k<5;k++){const l=links[Math.floor(Math.random()*links.length)];if(l)pulses.push({l,p:0,s:.012+Math.random()*.02})}}
function step(){cx.clearRect(0,0,W,H);if(!red)nodes.forEach(n=>{n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1});cx.lineWidth=.6;links.forEach(([a,b])=>{const A=nodes[a],B=nodes[b],d=Math.hypot(A.x-B.x,A.y-B.y);if(d<380){cx.strokeStyle='rgba(76,150,255,'+(.14*(1-d/380))+')';cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(B.x,B.y);cx.stroke()}});pulses=pulses.filter(p=>p.p<1);pulses.forEach(p=>{p.p+=p.s;const A=nodes[p.l[0]],B=nodes[p.l[1]],x=A.x+(B.x-A.x)*p.p,y=A.y+(B.y-A.y)*p.p;cx.fillStyle='rgba(76,196,255,'+(1-p.p)+')';cx.beginPath();cx.arc(x,y,2.2,0,7);cx.fill()});nodes.forEach(n=>{cx.fillStyle=n.kb?'rgba(76,196,255,.9)':'rgba(125,154,201,.5)';cx.shadowBlur=n.kb?9:0;cx.shadowColor='#4cc4ff';cx.beginPath();cx.arc(n.x,n.y,n.r,0,7);cx.fill();cx.shadowBlur=0});requestAnimationFrame(step)}
rebuild();step();if(!red)setInterval(fire,2800);return{rebuild,fire}})();
renderKB();
bubble('Nucleo inicializado. '+KB.length+' nos na memoria local. Pergunte algo, ou toque em \uD83E\uDDE0 para me ensinar. Tudo fica salvo so neste aparelho.','ia','sistema');
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
